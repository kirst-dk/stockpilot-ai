# StockPilot AI - Nginx Configuration
# www.stockpilotai.xyz → Landing Page
# app.stockpilotai.xyz → Application

# Redirect bare domain to www
server {
    listen 80;
    listen 7207;
    server_name stockpilotai.xyz;
    return 301 http://www.stockpilotai.xyz$request_uri;
}

# Landing page
server {
    listen 80;
    listen 7207;
    server_name www.stockpilotai.xyz;

    root /var/www/landing;
    index index.html;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets
    location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}

# Application
server {
    listen 80;
    listen 7207;
    server_name app.stockpilotai.xyz;

    root /var/www/app;
    index index.html;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Next.js static assets (_next directory)
    location /_next/static/ {
        expires 365d;
        add_header Cache-Control "public, immutable";
    }

    # Cache other static assets
    location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
